# Protocol v1 - every value here is a researcher decision (PRD s25), frozen by `freeze`.
protocol_version: 1
paths:
  raw: data/raw
  processed: data/processed
  artifacts: artifacts
parser:
  version: urls-v1
  max_url_length: 16384
cohort:
  purge_shared_groups: true          # symmetric removal of groups present in both sources
  feasibility_max_class_loss: 0.50
  feasibility_min_groups_per_class: 100
splits:
  algorithm: greedy-stratified-group-v1
  seed: 20261115
  ratios: {FIT: 0.6, VAL: 0.2, TEST: 0.2}
features:
  version: lexical37-v1
  keywords: [login, signin, verify, account, secure, update, password, banking, confirm, wallet]
selection:
  k_candidates: [8, 16, 24]
  q: 12
  folds: 3
  pi_repeats: 5
  k_tolerance_ap: 0.01
  proxy_rf: {n_estimators: 200, max_depth: 16, min_samples_leaf: 2, max_features: sqrt}
models:
  seeds: [17, 29, 43]
  threads: 4                         # effective = min(threads, cpu_count)
  rf: {n_estimators: 300, max_depth: 20, min_samples_leaf: 2, max_features: sqrt, bootstrap: true}
  lgbm:
    objective: binary
    boosting_type: gbdt
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    deterministic: true
    force_col_wise: true
thresholds:
  fpr_max: 0.01
statistics:
  bootstrap_replicates: 2000
  bootstrap_seed: 20261115
  invalid_fraction_warn: 0.05
effects:
  f1_abs: 0.01
  latency_rel: 0.10
benchmark:
  warmup: 10
  repeats: 30
  batch_sizes: [1, 1024]
  threads: [1, 4]                    # inference threads benchmarked (D-10)
  seed: 17                           # latency is measured on the seed-17 bundle of every config
explain:
  background: 100
  n_source: 500
  n_target: 500
  seed: 17
  feature_perturbation: interventional
  model_output: probability
smoke:
  n_estimators: 20
  seeds: [17]
